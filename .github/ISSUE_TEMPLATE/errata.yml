name: Erratum
description: Report a mistake in one of the books — a wrong formula, equation, solution, figure or typo.
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Errata are the most valuable contribution the books receive —
        fixes usually ship in the next release, within days.
  - type: dropdown
    id: book
    attributes:
      label: Book
      options:
        - "1 — School Chemistry (Grades 1–12)"
        - "2 — University Year 1 (not yet written)"
        - "3 — University Year 2 (not yet written)"
        - "4 — University Year 3 (not yet written)"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Edition
      options:
        - English
      default: 0
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: >
        Chapter and page, plus the version from the title page (e.g. v0.0.7) —
        or the URL of the online chapter.
      placeholder: "Chapter 30 (Oxidation and Reduction), page 288, v0.0.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the current text or formula, and say what you believe it should be.
    validations:
      required: true
